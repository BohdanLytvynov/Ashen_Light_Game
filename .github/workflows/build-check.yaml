name: UE C++ Build Check

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:    
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true # Use LFS files

      - name: Build Unreal Engine Project
        shell: cmd
        run: |
          :: Path to RunUAT.bat in Unreal Engine
          set ENGINE_PATH="D:\UE_Engines\UE_4.27\Engine\Build\BatchFiles\RunUAT.bat"
          
          :: Path to .uproject
          set PROJECT_PATH="%GITHUB_WORKSPACE%\Ashen_Light.uproject"

          :: Launch Project Build (Development Editor)
          %ENGINE_PATH% BuildCookRun ^
            -project=%PROJECT_PATH% ^
            -noP4 -platform=Win64 -clientconfig=Development ^
            -build -nodeploy -unattended -utf8output